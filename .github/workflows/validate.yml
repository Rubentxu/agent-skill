name: Validate agent skills

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate skill manifests and local references
        run: python3 scripts/validate_skills.py
      - name: Run collection validator tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Run skill utility tests
        run: python3 -m unittest discover -s skills/code-quality-evidence-review/tests -p 'test_*.py' -v
      - name: Run CogniCode diagrams router tests
        run: python3 -m unittest discover -s skills/cognicode-diagrams/tests -p 'test_*.py' -v
      - name: Check CogniCode diagrams affordances smoke
        run: python3 skills/cognicode-diagrams/scripts/affordances.py skills/cognicode-diagrams/examples/session-c4.json
      - name: Run delivery-first-testing router tests
        run: python3 -m unittest discover -s skills/delivery-first-testing/tests -p 'test_*.py' -v
      - name: Check delivery-first-testing navigation smoke
        run: python3 skills/delivery-first-testing/scripts/affordances.py skills/delivery-first-testing/examples/session-feature.json
      - name: Run distribution-first-release tests
        run: python3 -m unittest discover -s skills/distribution-first-release/tests -p 'test_*.py' -v
      - name: Check distribution-first-release navigation smoke
        run: python3 skills/distribution-first-release/scripts/affordances.py skills/distribution-first-release/examples/session-release.json
      - name: Run playful-learning-design router tests
        run: python3 -m unittest discover -s skills/playful-learning-design/tests -p 'test_*.py' -v
      - name: Check playful-learning-design navigation smoke
        run: python3 skills/playful-learning-design/scripts/affordances.py skills/playful-learning-design/examples/session-create.json
      - name: Run learning-game-html router tests
        run: python3 -m unittest discover -s skills/learning-game-html/tests -p 'test_*.py' -v
      - name: Check learning-game-html navigation smoke
        run: python3 skills/learning-game-html/scripts/affordances.py skills/learning-game-html/examples/session-create.json
